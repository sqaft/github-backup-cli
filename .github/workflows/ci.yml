name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    services:
      # S3-compatible server for the S3 integration tests. The credentials are fixed test
      # values for this throwaway container, not secrets.
      s3:
        image: andrewgaul/s3proxy:latest
        ports:
          - 9000:80
        env:
          S3PROXY_AUTHORIZATION: aws-v2-or-v4
          S3PROXY_IDENTITY: test-access
          S3PROXY_CREDENTIAL: test-secret
          JCLOUDS_PROVIDER: filesystem
          JCLOUDS_FILESYSTEM_BASEDIR: /data
    env:
      GHBACKUP_TEST_S3_ENDPOINT: http://localhost:9000
      GHBACKUP_TEST_S3_ACCESS_KEY_ID: test-access
      GHBACKUP_TEST_S3_SECRET_ACCESS_KEY: test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Ensure git-lfs is installed
        run: git lfs version || (sudo apt-get update && sudo apt-get install -y git-lfs)
      - run: npm run lint
      - run: npm run typecheck
      - name: Wait for the S3 server
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$GHBACKUP_TEST_S3_ENDPOINT/" || true)
            # An unauthenticated request is answered with 403 once S3Proxy is up.
            if [ "$code" = "403" ]; then echo "S3 server ready after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "S3 server did not become ready" >&2
          exit 1
      - run: npm test
      - run: npm run build
